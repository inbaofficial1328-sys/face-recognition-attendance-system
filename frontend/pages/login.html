<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Attendance System - Login</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <main>
        <section class="login-card">

            <div class="brand">
                <div class="brand-mark">FR</div>

                <div>
                    <span class="brand-label">ATTENDANCE SYSTEM</span>
                    <h1>Face Recognition Student Attendance System</h1>
                </div>
            </div>

            <p class="login-description">
                Secure attendance management using live camera face recognition.
            </p>

            <form>
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

                <button type="submit">Sign In</button>
            </form>

            <p class="login-notice">Authorized users only</p>

        </section>
    </main>

</body>
</html>
